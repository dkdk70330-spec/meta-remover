<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PNG 메타데이터 · 스텔스 제거기</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">PuddingCat EXIF Remover</p>
  </header>

    <section class="action-grid three-card-grid">
      <article class="upload-card card" aria-labelledby="uploadTitle">
        <header class="card-heading">
          <div>
            <p class="section-kicker">UPLOAD</p>
            <h2 id="uploadTitle">업로드</h2>
          </div>
          <div class="upload-header-actions">
            <button id="removeMetadataButton" class="primary-button compact-action-button" type="button" disabled>EXIF 제거</button>
            <button id="clearUploadButton" class="ghost-button" type="button" disabled>전체 비우기</button>
          </div>
        </header>

        <div id="dropZone" class="drop-zone" tabindex="0" role="button" aria-label="PNG 파일을 끌어놓거나 선택">
          <strong>드래그</strong>
          <div class="button-row">
            <label id="selectFilesButton" class="primary-button file-trigger" for="fileInput">파일</label>
            <label id="selectFolderButton" class="secondary-button file-trigger" for="folderInput">폴더</label>
            <button id="pasteUploadButton" class="secondary-button" type="button">붙여넣기</button>
          </div>
          <input id="fileInput" class="visually-hidden" type="file" accept="image/png,.png" multiple>
          <input id="folderInput" class="visually-hidden" type="file" accept="image/png,.png" webkitdirectory directory multiple>
        </div>

        <div id="uploadList" class="thumb-list" aria-label="업로드된 이미지 목록">
          <p class="empty-state">아직 업로드된 PNG가 없습니다.</p>
        </div>


        <div class="status-block">
          <div class="status-line"><span>업로드·제거 상태</span><output id="uploadStatus">대기 중</output></div>
          <progress id="uploadProgress" max="100" value="0"></progress>
        </div>
      </article>

      <article class="download-card card" aria-labelledby="downloadTitle">
        <header class="card-heading">
          <div>
            <p class="section-kicker">DOWNLOAD</p>
            <h2 id="downloadTitle">다운로드</h2>
          </div>
          <div class="download-header-actions">
            <span id="readyCount" class="count-badge">0개 준비</span>
            <button id="downloadZipButton" class="primary-button compact-download-button" type="button" disabled>ZIP 다운</button>
          </div>
        </header>

        <div id="downloadList" class="thumb-list download-list" aria-label="변환 완료 이미지 목록">
          <p class="empty-state">제거가 완료되면 여기에 변환 이미지가 표시됩니다.</p>
        </div>

        <div class="status-block">
          <div class="status-line"><span>다운로드 상태</span><output id="downloadStatus">대기 중</output></div>
          <progress id="downloadProgress" max="100" value="0"></progress>
        </div>
      </article>

      <article class="inspect-card card" aria-labelledby="inspectTitle">
      <header class="inspect-heading">
        <div>
          <p class="section-kicker">CHECK</p>
          <h2 id="inspectTitle">확인</h2>
        </div>
        <strong id="inspectResultTitle" class="inspect-result is-neutral">이미지를 선택하세요</strong>
      </header>

      <div id="inspectDropZone" class="inspect-picker" tabindex="0">
        <strong>드래그</strong>
        <div class="button-row">
          <label class="secondary-button" for="inspectFileInput">파일</label>
          <button id="inspectPasteButton" class="secondary-button" type="button">붙여넣기</button>
        </div>
        <input id="inspectFileInput" class="visually-hidden" type="file" accept="image/png,.png">
      </div>

      <div class="inspect-preview-only">
        <div class="checkerboard">
          <img id="inspectImage" alt="검사 이미지 미리보기" hidden>
          <span id="inspectImageEmpty">이미지 미리보기</span>
        </div>
      </div>
      </article>
    </section>
  </main>

  <footer class="site-footer"><p>모든 처리는 현재 브라우저 탭 안에서만 이루어집니다.</p></footer>
  <script src="./app.js"></script>
</body>
</html>
